<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:0;
  height:100vh;
  background:#0c0c0c;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial;
}

.circle{
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  border:10px dashed #00f0ff;
  animation:rotate 10s linear infinite;
}

@keyframes rotate{
  0%{transform:rotate(0);}
  100%{transform:rotate(360deg);}
}

.login-box{
  position:relative;
  padding:42px;
  border-radius:16px;
  z-index:2;
  text-align:center;

  background:
    radial-gradient(120% 140% at 10% 0%, rgba(0,255,255,0.18), transparent 40%),
    radial-gradient(120% 140% at 90% 100%, rgba(0,170,255,0.18), transparent 45%),
    linear-gradient(135deg, rgba(0,220,255,0.12), rgba(0,140,255,0.06));

  backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(0,240,255,0.25);

  box-shadow:
    0 8px 30px rgba(0,200,255,0.18),
    inset 0 0 24px rgba(0,220,255,0.18);

  animation:edxGlow 4s ease-in-out infinite alternate;
}

@keyframes edxGlow{
  0%{box-shadow:0 8px 24px rgba(0,200,255,0.14), inset 0 0 18px rgba(0,220,255,0.14);}
  100%{box-shadow:0 12px 36px rgba(0,200,255,0.22), inset 0 0 28px rgba(0,220,255,0.22);}
}

.login-box h2{
  color:#00f0ff;
}

.login-box input{
  width:100%;
  padding:10px;
  margin:10px 0;
  background:rgba(0,0,0,0.6);
  border:none;
  border-radius:5px;
  color:#00eaff;
  font-weight:bold;
}

::placeholder{
  color:#00eaff;
}

.login-box button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#00f0ff;
  border:none;
  border-radius:5px;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

#errorMsg{
  font-family:'Orbitron';
  letter-spacing:2px;
  margin-top:10px;
  font-size:12px; /* 🔻 smaller timer text */
}

.login-box.error{
  animation:shake 0.3s, redGlow 1s ease-in-out 2;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}

@keyframes redGlow{
  0%{box-shadow:0 0 10px #ff0000;}
  50%{box-shadow:0 0 25px #ff0000;}
  100%{box-shadow:0 0 10px #ff0000;}
}

.dev-footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  text-align:center;
  padding:8px;
  font-family:'Orbitron';
  font-size:12px;
  background:rgba(30,60,90,0.4);
  z-index:5;
}

.sky{color:#00eaff;}
.stylish{
  color:#00ff88;
  text-decoration:none;
  text-shadow:0 0 5px #00ff88;
}
</style>
</head>

<body>

<div class="circle"></div>

<div class="login-box">
  <h2>BAIJID ADMIN PENNELL</h2>
  
  <form id="loginForm">
    <input id="username" type="text" placeholder="Enter your user name" required>
    <input id="password" type="password" placeholder="Enter your password" required>
    <button type="submit">Login</button>
  </form>

  <p id="errorMsg" style="display:none;"></p>
</div>

<audio id="beepSound">
  <source src="https://www.soundjay.com/button/beep-07.wav" type="audio/wav">
</audio>

<audio id="grantedSound">
  <source src="https://www.soundjay.com/misc/sounds/robot-blip-2.wav" type="audio/wav">
</audio>

<script>
const canvas=document.createElement("canvas");
document.body.prepend(canvas);
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  canvas.height=window.innerHeight;
  canvas.width=window.innerWidth;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

canvas.style.position="fixed";
canvas.style.top="0";
canvas.style.left="0";
canvas.style.zIndex="0";

const letters="01ABCDEF";
const fontSize=16;
let columns=canvas.width/fontSize;
let drops=[];

function initDrops(){
  columns=canvas.width/fontSize;
  drops=[];
  for(let i=0;i<columns;i++){drops[i]=1;}
}
initDrops();
window.addEventListener("resize",initDrops);

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00FFFF";
  ctx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){
    const text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
      drops[i]=0;
    }
    drops[i]++;
  }
}
setInterval(draw,33);
</script>

<script>
const form=document.getElementById('loginForm');
const box=document.querySelector('.login-box');
const errorMsg=document.getElementById('errorMsg');
const beep=document.getElementById('beepSound');
const granted=document.getElementById('grantedSound');

let attempts=0;
let locked=false;
let countdown=60;
let timerInterval=null;

function typeText(text){
  errorMsg.innerHTML="";
  let i=0;
  function typing(){
    if(i<text.length){
      errorMsg.innerHTML+=text.charAt(i);
      i++;
      setTimeout(typing,50);
    }
  }
  typing();
}

function startTimer(){
  locked=true;
  countdown=60;

  timerInterval=setInterval(()=>{
    errorMsg.style.display="block";
    errorMsg.style.color="#ff2b2b";
    errorMsg.innerHTML=`TRY AGAIN ${countdown}s`;
    countdown--;

    if(countdown<0){
      clearInterval(timerInterval);
      locked=false;
      attempts=0;
      errorMsg.innerHTML="";
    }
  },1000);
}

form.addEventListener('submit',function(e){
  e.preventDefault();

  if(locked){
    return;
  }

  const u=username.value.trim();
  const p=password.value.trim();

  if(u==='BAIJID' && p==='BAIJID@'){
    errorMsg.style.display="block";
    errorMsg.style.color="#00ff88";
    granted.play();
    typeText("✅ ACCESS GRANTED");

    setTimeout(()=>{
      window.location.href='https://baijidalam.github.io/dark-cyber-homepage/';
    },1200);

  }else{
    attempts++;
    errorMsg.style.display="block";
    errorMsg.style.color="#ff2b2b";
    box.classList.add("error");
    beep.play();

    if(attempts>=3){
      typeText("❌ TOO MANY ATTEMPTS");
      startTimer();
    }else{
      typeText("❌ ACCESS DENIED");
    }

    setTimeout(()=>box.classList.remove("error"),1200);
  }
});
</script>
